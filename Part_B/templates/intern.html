{% extends "base.html" %}

{% block content %}

<div class="card">
    <h2>👤 Intern Profile</h2>

    <p><b>ID:</b> {{ intern.id }}</p>
    <p><b>Name:</b> {{ intern.name }}</p>
    <p><b>Email:</b> {{ intern.email }}</p>
    <p><b>Domain:</b> {{ intern.domain }}</p>
</div>

<br>

<a href="/attendance-form/{{ intern.id }}"><button>📅 Attendance</button></a>
<a href="/assign-mentor-form/{{ intern.id }}"><button>🎓 Mentor</button></a>

{% endblock %}
