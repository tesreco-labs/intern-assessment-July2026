<form method="POST">

    Name:
    <input type="text"
           name="name"
           value="{{ intern.name }}">

    <br><br>

    Email:
    <input type="email"
           name="email"
           value="{{ intern.email }}">

    <br><br>

    Domain:
    <input type="text"
           name="domain"
           value="{{ intern.domain }}">

    <br><br>

    <button type="submit">
        Update
    </button>

</form>
