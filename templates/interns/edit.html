{% extends "base.html" %}

{% block content %}
<section class="form-section">
    <h1>Edit Intern</h1>
    {% if error %}
    <p class="error-message">{{ error }}</p>
    {% endif %}
    <form method="post" class="intern-form">
        <label for="intern_id">Intern ID</label>
        <input id="intern_id" value="{{ intern.intern_id }}" disabled>

        <label for="name">Name</label>
        <input id="name" name="name" value="{{ intern.name }}" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ intern.email }}" required>

        <label for="domain">Domain</label>
        <input id="domain" name="domain" value="{{ intern.domain }}" required>

        <button type="submit">Update Intern</button>
    </form>
</section>
{% endblock %}
