{% extends "base.html" %}

{% block content %}
<section class="form-section">
    <h1>Add Intern</h1>
    {% if error %}
    <p class="error-message">{{ error }}</p>
    {% endif %}
    <form method="post" class="intern-form">
        <label for="name">Name</label>
        <input id="name" name="name" value="{{ form.get('name', '') }}" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required>

        <label for="domain">Domain</label>
        <input id="domain" name="domain" value="{{ form.get('domain', '') }}" required>

        <button type="submit">Add Intern</button>
    </form>
</section>
{% endblock %}
