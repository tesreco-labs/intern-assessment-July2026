{% extends "base.html" %}

{% block title %}Edit Intern - TESRECO Portal{% endblock %}

{% block content %}
<div class="form-container">
    <div class="card">
        <h2 class="card-title" style="text-align: center; border-bottom: 2px solid #0d6efd;">Edit Intern Profile</h2>
        <p style="text-align: center; color: #6c757d; font-size: 0.9rem; margin-bottom: 1.5rem;">
            Update the information for Intern ID #{{ intern.id }}
        </p>

        <form action="/edit-intern/{{ intern.id }}" method="POST" id="intern-edit-form">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" value="{{ intern.name }}" required class="form-control">
                <span id="name-error" style="color: #dc3545; font-size: 0.8rem;"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" value="{{ intern.email }}" required class="form-control">
                <span id="email-error" style="color: #dc3545; font-size: 0.8rem;"></span>
            </div>

            <div class="form-group">
                <label for="domain">Internship Domain:</label>
                <select id="domain" name="domain" required class="form-control">
                    <option value="Data Science" {% if intern.domain == 'Data Science' %}selected{% endif %}>Data Science</option>
                    <option value="Web Development" {% if intern.domain == 'Web Development' %}selected{% endif %}>Web Development</option>
                    <option value="Artificial Intelligence" {% if intern.domain == 'Artificial Intelligence' %}selected{% endif %}>Artificial Intelligence</option>
                    <option value="Python Development" {% if intern.domain == 'Python Development' %}selected{% endif %}>Python Development</option>
                    <option value="Cloud & DevOps" {% if intern.domain == 'Cloud & DevOps' %}selected{% endif %}>Cloud & DevOps</option>
                    <option value="Cybersecurity" {% if intern.domain == 'Cybersecurity' %}selected{% endif %}>Cybersecurity</option>
                </select>
            </div>

            <div class="form-group">
                <label for="duration">Duration (Months):</label>
                <input type="number" id="duration" name="duration" min="1" max="12" value="{{ intern.duration }}" required class="form-control">
                <span id="duration-error" style="color: #dc3545; font-size: 0.8rem;"></span>
            </div>

            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
                <a href="/view-interns" class="btn btn-secondary btn-block" style="margin-top: 0.5rem; text-align: center;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
